pr:
  - main
  - develop

trigger:
  - main
  - develop

parameters:
  - name: validateOnPhpVersion
    type: string
    default: 8.4
  - name: ShouldBuildReleasePackage
    type: boolean
    default: false
  - name: ShouldDeployApplication
    type: boolean
    default: false

pool:
  vmImage: ubuntu-24.04

resources:
  repositories:
    - repository: Infra
      type: git
      name: ECOM-EASY-PLUGINS/connect
      ref: refs/heads/main

variables:
  extensionName: NetsNexiCheckout
  publishDir: ./bin
  composerVersion: 2.8.12 # Temporarily pin Composer to 2.8.12 so Shopware 6.7.13 can be installed for validation; Composer 2.9+ blocks this version because of its security advisories.
  githubRepo: Nets-eCom/shopware6-easy-checkout

stages:
  - stage: Validate
    displayName: 'Validate Stage'
    jobs:
      - job: Validate_Job
        steps:
          - script: |
              sudo update-alternatives --set php /usr/bin/php${{ parameters.validateOnPhpVersion }}
              php -version
            displayName: 'Use PHP version ${{ parameters.validateOnPhpVersion }}'
          - script: sudo composer self-update $(composerVersion)
            displayName: 'Pin Composer version $(composerVersion)'
          - script: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-redis
            workingDirectory: $(System.DefaultWorkingDirectory)
            displayName: 'Composer install'
          - script: |
              find ./src -type f -name '*.php' ! -path './src/vendor/*' -print0 \
                | xargs -0 -n 1 php -l | (! grep -Ev '^No syntax errors detected in ')
            displayName: 'Run PHP lint'
          - script: make ecs-check
            displayName: 'Run ECS'
          - script: make rector-check
            displayName: 'Run Rector'
          - script: make phpstan-check
            displayName: 'Run PHPStan'
          - script: make phpunit
            displayName: 'Run tests with PHPUnit'
  - stage: Translation_Change
    displayName: 'Add Translation Change Tag If Needed'
    condition: |
      and(
        succeeded(),
        eq(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: Add_Translation_Change_Tag
        steps:
          - checkout: self
            fetchDepth: 0
          - script: |
              git diff --name-only origin/develop...HEAD
              if git diff --name-only origin/develop...HEAD | grep -Eq 'src/Resources/(app/administration/src/snippet/en-GB.json|snippet/en-GB.json)'; then
                echo "##vso[build.addbuildtag]TranslationChanged"
              fi
            displayName: 'Check changed files'
  - stage: Build_Release_Package
    displayName: Build_Release_Package
    dependsOn: Validate
    condition: |
      and(
        succeeded(),
        or(
          in(variables['Build.SourceBranch'], 'refs/heads/main'),
          and(${{ parameters.ShouldBuildReleasePackage }}, eq(variables['Build.Reason'], 'Manual'))
        )
      )
    jobs:
      - job: Build_Release_Package
        steps:
          - task: AzureKeyVault@2
            displayName: Azure Key Vault
            inputs:
              azureSubscription: sc-P_MS-ECOM-EASY-PLUGINS
              KeyVaultName: 'p-econdevops-weu-kv'
              SecretsFilter: '*'
              RunAsPreJob: false
          - checkout: self
          - script: |
              curl -1sLf 'https://dl.cloudsmith.io/public/friendsofshopware/stable/setup.deb.sh' | sudo -E bash
              sudo apt-get -o DPkg::Lock::Timeout=60 install shopware-cli
              sudo apt-get -o DPkg::Lock::Timeout=60 install jq -y
            displayName: 'Install dependencies'
          - script: |
              mkdir $(publishDir)
            displayName: 'Create publish dir'
          - task: UseNode@1
            inputs:
              version: '20.11'
            displayName: 'Install Node.js 20'
          - script: |
              sed -i "s|\$this->registerProvisionSubscriber(\$container)|\$this->registerProvisionSubscriber(\$container, '$(shopware-provision-identifier)')|" src/NetsNexiCheckout.php
              sed -i "s/COMMERCE_PLATFORM_TAG = 'Shopware6';/COMMERCE_PLATFORM_TAG = 'Shopware6_m';/g" src/NetsNexiCheckout.php
              shopware-cli extension zip --disable-git . --release
              mv $(extensionName).zip $(publishDir)/$(extensionName).zip
            displayName: 'Build extension'
          - script: |
              shopware-cli extension validate $(publishDir)/$(extensionName).zip
            displayName: 'Validate extension'
          - publish: $(publishDir)
            artifact: $(extensionName)
  - stage: Deploy_Development # This stage success will trigger deployment of CD-Services-Shopware6
    displayName: Deploy_Development
    condition: |
      and(
        succeeded(),
        or(
          in(variables['Build.SourceBranch'], 'refs/heads/develop'),
          and(${{ parameters.ShouldDeployApplication }}, eq(variables['Build.Reason'], 'Manual'))
        )
      )
    jobs:
      - job: Trigger_Deploy_Development
        steps:
          - checkout: none
          - bash: echo "CD-Services-Shopware6 runs after this completes"

  - stage: Release
    displayName: 'Release to GitHub'
    dependsOn: []
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: PushToGitHub
        displayName: 'Tag and push to GitHub'
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - script: |
              VERSION=$(awk '/^### Version /{print $3; exit}' CHANGELOG.md)
              if [ -z "$VERSION" ]; then
                echo "##[error]Could not extract version from CHANGELOG.md"
                exit 1
              fi
              echo "Detected version: $VERSION"
              echo "##vso[task.setvariable variable=RELEASE_VERSION]$VERSION"
            displayName: 'Extract version from CHANGELOG.md'

          - script: |
              git config user.email "azure-pipelines@noreply.com"
              git config user.name "Azure Pipelines"
              git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"

              GITHUB_REMOTE="https://x-access-token:$(GITHUB_PAT)@github.com/$(githubRepo).git"
              git remote add github "$GITHUB_REMOTE" 2>/dev/null || git remote set-url github "$GITHUB_REMOTE"
              git push github HEAD:main --force

              if git ls-remote --tags github "$RELEASE_VERSION" | grep -q "refs/tags/$RELEASE_VERSION$"; then
                echo "Tag $RELEASE_VERSION already on GitHub, skipping"
              else
                git push github "$RELEASE_VERSION"
                echo "Pushed tag $RELEASE_VERSION to GitHub"
              fi
            displayName: 'Push branch and tag to GitHub'
            env:
              GITHUB_PAT: $(GITHUB_PAT)
