name: Create GitHub Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shopware-cli
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/friendsofshopware/stable/setup.deb.sh' | sudo -E bash
          sudo apt-get -o DPkg::Lock::Timeout=60 install shopware-cli -y

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          CHANGELOG=$(awk "/^### Version ${VERSION}[[:space:]]/{found=1; next} found && /^### Version /{exit} found{print}" CHANGELOG.md)
          {
            echo 'BODY<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build zip archive
        run: |
          VERSION="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i "s/{{ version }}/~6.6.1/g" .shopware-extension.yml
          shopware-cli extension zip --disable-git . --release
          mv NetsNexiCheckout.zip "${REPO_NAME}-${VERSION}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          ZIP="${REPO_NAME}-${VERSION}.zip"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists, skipping"
            exit 0
          fi

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes "${{ steps.changelog.outputs.BODY }}" \
            --latest \
            "${ZIP}"
